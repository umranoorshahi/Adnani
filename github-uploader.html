<title>Adnani Uploader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f0fdf4;padding:16px}
h2{color:#14532d;margin-bottom:4px;font-size:1.2rem}
p{color:#666;font-size:.82rem;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px}
label{font-size:.82rem;font-weight:700;display:block;margin-bottom:4px}
input{width:100%;padding:10px;border:1.5px solid #d1fae5;border-radius:8px;font-size:.88rem;margin-bottom:12px}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:8px}
button:disabled{background:#86efac}
.msg{padding:12px;border-radius:8px;font-size:.85rem;line-height:1.6;margin-top:8px;display:none}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.step{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.82rem}
.dot{width:10px;height:10px;border-radius:50%;background:#ccc;flex-shrink:0}
.dot.done{background:#16a34a}
.dot.fail{background:#dc2626}
.dot.loading{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>

async function pushToRepo(tok, repo, step) {
  const dot = document.getElementById('d'+step);
  const s = document.getElementById('s'+step);
  dot.className='dot loading';
  s.textContent = 'Uploading to ' + repo + '...';
  
  try {
    const g = await fetch('https://api.github.com/repos/'+repo+'/contents/index.html',
      {headers:{'Authorization':'token '+tok,'Accept':'application/vnd.github.v3+json'}});
    let sha = null;
    if(g.ok){ const d=await g.json(); sha=d.sha; }
    
    const body = {message:'Update Adnani Connected App', content:B64};
    if(sha) body.sha = sha;
    
    const p = await fetch('https://api.github.com/repos/'+repo+'/contents/index.html',
      {method:'PUT',
        headers:{'Authorization':'token '+tok,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)});
    
    if(p.ok){
      dot.className='dot done';
      s.textContent = '✅ ' + repo + ' — Done!';
      return true;
    } else {
      const e=await p.json();
      dot.className='dot fail';
      s.textContent = '❌ ' + repo + ': ' + (e.message||'Error');
      return false;
    }
  } catch(e) {
    dot.className='dot fail';
    s.textContent = '❌ ' + repo + ': ' + e.message;
    return false;
  }
}

async function uploadBoth() {
  const tok = document.getElementById('tok').value.trim();
  if(!tok){ alert('Token daalna zaruri hai!'); return; }
  
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled=true; btn.textContent='⏳ Uploading...';
  msg.style.display='none';
  
  // Reset dots
  ['d1','d2'].forEach(id=>document.getElementById(id).className='dot');
  
  const r1 = await pushToRepo(tok, 'umranoorshahi/umranoorshahi.github.io', 1);
  const r2 = await pushToRepo(tok, 'umranoorshahi/Adnani', 2);
  
  msg.style.display='block';
  if(r1&&r2) {
    msg.className='msg ok';
    msg.innerHTML='🎉 <b>Dono repos update!</b><br>2 minute baad dono URLs pe live:<br>• <a href="https://umranoorshahi.github.io">umranoorshahi.github.io</a><br>• <a href="https://umranoorshahi.github.io/Adnani/">umranoorshahi.github.io/Adnani/</a>';
    btn.textContent='✅ Done!';
  } else {
    msg.className='msg err';
    msg.textContent='Kuch errors hain — upar dekho. Token expire hua hoga — naya banao.';
    btn.disabled=false;
    btn.textContent='🔄 Try Again';
  }
}
</script>
</body>
</html>
